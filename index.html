<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#33506B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Layers" />
    <meta name="description" content="A private relationship-development and social-skills coaching app." />
    <title>Layers</title>
    <script>
      // Paint the saved theme's background before the app loads, so dark
      // mode doesn't flash white. Colours match THEME_*.paper in src/theme.js.
      try {
        var saved = JSON.parse(localStorage.getItem('layers-app-state-v1') || '{}');
        document.documentElement.style.background = saved && saved.theme === 'dark' ? '#1B1E27' : '#F5F6F1';
      } catch (e) { /* storage unavailable: keep the default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
